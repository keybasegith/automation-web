<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Digital Business Card — Template</title>

<!--
  ============================================================================
  KEYBASE FINANCIAL GROUP — DIGITAL BUSINESS CARD TEMPLATE
  ============================================================================

  Single self-contained file. No build step, no framework, NO EXTERNAL
  REQUESTS of any kind — no CDN, no web fonts, no analytics. The only files
  it loads are the three images listed below, served from your own server.
  Open it in any browser to preview.

  TO CREATE A NEW CARD:
    1. Edit the CARD object in the script block at the bottom of this file.
       That is the ONLY section that needs to change per person.
    2. Put the three images on your server and point ASSET_BASE (also in the
       CARD object) at the folder holding them, or give each image a full
       https:// URL.
    3. Save as <firstname>.html and publish.

  IMAGES (shipped alongside this file in ./business-card-assets/):
    keybase-logo.png        700x166 PNG, transparent   — shared by all cards
    profile-background.jpg  1200x800 JPEG              — shared by all cards
    profile.jpg             400x600 JPEG               — one per advisor
  If any image fails to load the card still renders correctly: the logo is
  dropped, the banner falls back to a brand-green gradient, and the portrait
  falls back to the advisor's initials.

  FRONT  = logo, address, banner, portrait, name, title, tagline, contact,
           "Email Me" + "Share Card" buttons.
  BACK    = QR code pointing at cardUrl. Toggled by the button top-right.

  QR CODE: generated in-page by the small encoder at the bottom of this file
  (ISO/IEC 18004, byte mode, error-correction level M) and drawn as inline
  SVG. It needs no library, no CDN and no network access. If script execution
  is blocked entirely, the QR panel falls back to showing the URL as text.
  ============================================================================
-->

<style>
  /* ---------- Design tokens ---------------------------------------------- */
  :root {
    --brand:        #006d6e;   /* Keybase green — accent / flip button */
    --ink:          #0f172a;
    --ink-soft:     #475569;
    --ink-muted:    #64748b;
    --ink-faint:    #94a3b8;
    --page-bg:      #f1f5f9;
    --card-bg:      #ffffff;
    --card-back-bg: #0a0a0a;
    --radius:       22px;
    --font-body:    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    "Helvetica Neue", Arial, sans-serif;
    --font-display: Georgia, "Times New Roman", serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 12px;
    background: var(--page-bg);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Flip container --------------------------------------------- */
  .card-stage {
    position: relative;
    width: 100%;
    max-width: 360px;
    perspective: 1200px;
  }

  .flipper {
    position: relative;
    transition: transform .7s ease-in-out;
    transform-style: preserve-3d;
  }
  .card-stage.is-flipped .flipper { transform: rotateY(180deg); }

  .face { backface-visibility: hidden; }
  .face--back {
    position: absolute;
    inset: 0;
    transform: rotateY(180deg);
  }

  /* ---------- Flip toggle button ----------------------------------------- */
  .flip-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 20;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    background: rgba(255,255,255,.92);
    color: var(--ink);
    box-shadow: 0 4px 6px -1px rgba(0,0,0,.1);
    outline: 1px solid rgba(0,0,0,.1);
    transition: background .2s, color .2s;
  }
  .card-stage.is-flipped .flip-btn {
    background: var(--brand);
    color: #fff;
  }

  /* ---------- Card front -------------------------------------------------- */
  .card {
    overflow: hidden;
    border-radius: var(--radius);
    background: var(--card-bg);
    box-shadow: 0 24px 60px -20px rgba(15,23,42,.25);
    outline: 1px solid rgba(15,23,42,.05);
  }

  .card__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    /* Right padding keeps the address clear of the flip button. */
    padding: 16px 56px 8px 16px;
  }
  .card__logo {
    height: 56px;
    width: 104px;
    object-fit: contain;
    object-position: left center;
    flex-shrink: 0;
  }
  .card__address {
    display: flex;
    align-items: center;
    gap: 6px;
    text-align: right;
  }
  .card__address p {
    margin: 0;
    font-size: 10px;
    line-height: 1.4;
    color: #334155;
    white-space: nowrap;
  }
  .icon-pin { width: 12px; height: 12px; flex-shrink: 0; fill: var(--ink); }

  /* Banner + portrait.
     The gradient shows through if the banner image is missing or blocked. */
  .card__banner-wrap {
    position: relative;
    background: linear-gradient(135deg, var(--brand), #04494a);
  }
  .card__banner {
    height: 160px;
    width: 100%;
    object-fit: cover;
    display: block;
  }
  .card__banner.is-missing { visibility: hidden; }
  .card__portrait {
    position: absolute;
    left: 50%;
    bottom: -48px;
    width: 96px;
    height: 96px;
    transform: translateX(-50%);
    border-radius: 999px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,.1);
    outline: 4px solid #fff;
  }
  .card__portrait img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    /* Nudge the crop per person if the face sits high or low. */
    object-position: 50% 20%;
    transform: scale(1.1);
  }
  /* Initials shown when the portrait is missing or blocked. */
  .card__initials {
    display: none;
    width: 100%;
    height: 100%;
    align-items: center;
    justify-content: center;
    background: var(--brand);
    color: #fff;
    font-family: var(--font-display);
    font-size: 34px;
    font-weight: 700;
    letter-spacing: .02em;
  }
  .card__portrait.is-missing img      { display: none; }
  .card__portrait.is-missing .card__initials { display: flex; }

  .card__body { padding: 64px 20px 20px; }

  .card__name {
    margin: 0;
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -.01em;
    text-align: center;
    color: var(--ink);
  }
  .card__title {
    margin: 4px 0 0;
    font-size: 12px;
    font-weight: 500;
    text-align: center;
    color: var(--ink-soft);
  }
  .card__tagline {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.6;
    text-align: center;
    color: var(--ink-muted);
  }

  .card__contact {
    margin-top: 16px;
    text-align: center;
    font-size: 11px;
    line-height: 1.5;
    color: var(--ink-soft);
  }
  .card__contact p { margin: 0 0 2px; }
  .card__contact a { color: inherit; text-decoration: none; }
  .card__contact a:hover { color: var(--ink); }
  .label { color: var(--ink-faint); }
  .sep   { color: #cbd5e1; }

  /* CTAs */
  .card__actions { margin-top: 20px; display: grid; gap: 10px; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 10px 16px;
    border: 0;
    border-radius: 12px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    transition: background .2s;
  }
  .btn--primary   { background: #000;     color: #fff; }
  .btn--primary:hover   { background: #262626; }
  .btn--secondary { background: #f1f5f9; color: #334155; }
  .btn--secondary:hover { background: #e2e8f0; }
  .btn svg { width: 16px; height: 16px; }

  /* ---------- Card back (QR) ---------------------------------------------- */
  .card-back {
    height: 100%;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    border-radius: var(--radius);
    background: var(--card-back-bg);
    box-shadow: 0 24px 60px -20px rgba(15,23,42,.5);
  }
  .qr-slot {
    width: 192px;
    height: 192px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qr-slot svg { width: 100%; height: 100%; display: block; }
  .qr-fallback {
    font-size: 11px;
    color: rgba(255,255,255,.6);
    text-align: center;
    word-break: break-all;
    padding: 0 8px;
  }
  .card-back__name {
    margin: 16px 0 0;
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 700;
    text-align: center;
    color: #fff;
  }
  .card-back__meta {
    margin: 2px 0 0;
    font-size: 11px;
    text-align: center;
    color: rgba(255,255,255,.6);
  }

  /* ---------- Very narrow phones (320px-class) ---------------------------- */
  @media (max-width: 359px) {
    .card__header    { padding: 14px 52px 8px 14px; gap: 8px; }
    .card__logo      { height: 48px; width: 72px; }
    .card__address p { font-size: 9px; }
  }

  /* ---------- Larger phones / desktop ------------------------------------- */
  @media (min-width: 640px) {
    body { padding: 48px 16px; }
    .card-stage    { max-width: 420px; }
    .card          { border-radius: 28px; }
    .card__header  { padding: 20px 60px 12px 20px; }
    .card__logo    { height: 80px; width: 148px; }
    .card__initials { font-size: 46px; }
    .card__address p { font-size: 11px; }
    .icon-pin      { width: 14px; height: 14px; }
    .card__banner  { height: 220px; }
    .card__portrait{ width: 128px; height: 128px; bottom: -64px; }
    .card__body    { padding: 80px 28px 28px; }
    .card__name    { font-size: 28px; }
    .card__title   { font-size: 14px; }
    .card__tagline { font-size: 13px; margin-top: 12px; }
    .card__contact { font-size: 13px; margin-top: 20px; }
    .card__actions { margin-top: 24px; gap: 12px; }
    .btn           { padding: 12px 16px; font-size: 14px; }
    .qr-slot       { width: 240px; height: 240px; }
    .card-back__name { font-size: 18px; margin-top: 24px; }
    .card-back__meta { font-size: 12px; }
  }
</style>
</head>

<body>

<div class="card-stage" id="kb-stage">

  <!-- Flip toggle -->
  <button type="button" class="flip-btn" id="kb-flipBtn" aria-label="Show QR code">
    <svg id="kb-iconQr" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
      <path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm8 0h2v2h-2v-2zm4 0h2v2h-2v-2zm-4 4h2v2h-2v-2zm4 0h4v2h-4v-2z"/>
    </svg>
    <svg id="kb-iconClose" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="display:none">
      <path d="M6 6l12 12M18 6L6 18"/>
    </svg>
  </button>

  <div class="flipper">

    <!-- ======================= FRONT ======================= -->
    <div class="face face--front">
      <article class="card">

        <header class="card__header">
          <img class="card__logo" id="kb-logo" alt="" />
          <div class="card__address">
            <svg class="icon-pin" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
            </svg>
            <div>
              <p id="kb-addr1"></p>
              <p id="kb-addr2"></p>
            </div>
          </div>
        </header>

        <div class="card__banner-wrap">
          <img class="card__banner" id="kb-banner" alt="" />
          <div class="card__portrait" id="kb-portraitWrap">
            <img id="kb-portrait" alt="" />
            <div class="card__initials" id="kb-initials" aria-hidden="true"></div>
          </div>
        </div>

        <div class="card__body">
          <h1 class="card__name"  id="kb-name"></h1>
          <p  class="card__title" id="kb-title"></p>
          <p  class="card__tagline" id="kb-tagline"></p>

          <div class="card__contact">
            <p><span class="label">T:</span> <a id="kb-phoneLink"></a></p>
            <p id="kb-tollFreeRow" style="display:none">
              <span class="label">TF:</span> <a id="kb-tollFreeLink"></a>
            </p>
            <p>
              <a id="kb-emailLink"></a>
              <span class="sep">·</span>
              <a id="kb-siteLink" target="_blank" rel="noopener noreferrer"></a>
            </p>
          </div>

          <div class="card__actions">
            <a class="btn btn--primary" id="kb-emailBtn">Email Me</a>
            <button type="button" class="btn btn--secondary" id="kb-shareBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
                <path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>
              </svg>
              <span id="kb-shareLabel">Share Card</span>
            </button>
          </div>
        </div>

      </article>
    </div>

    <!-- ======================= BACK (QR) ======================= -->
    <div class="face face--back">
      <article class="card-back">
        <div class="qr-slot" id="kb-qrSlot">
          <div class="qr-fallback" id="kb-qrFallback"></div>
        </div>
        <p class="card-back__name" id="kb-qrName"></p>
        <p class="card-back__meta" id="kb-qrTitle"></p>
        <p class="card-back__meta" id="kb-qrCompany"></p>
      </article>
    </div>

  </div>
</div>

<script>
/* Everything runs inside this wrapper, so the card defines no global variables
   and cannot clash with scripts already on the host page (jQuery's $, etc.). */
(function () {
"use strict";

/* ============================================================================
   EDIT ONLY THIS OBJECT PER PERSON
   ========================================================================= */
const CARD = {
  firstName: "First",
  lastName:  "Last",
  title:     "Job Title",
  company:   "Keybase Financial Group",
  tagline:   "Building and Preserving Personal Wealth",

  // Public URL this card lives at — also what the QR code encodes.
  cardUrl:   "https://example.com/businesscard-first",

  // Folder the three images below are served from. Use "" if they sit next to
  // this file, or a path/absolute URL such as "/images/businesscard/".
  assetBase: "business-card-assets/",

  // Images: file names relative to assetBase, or full https:// URLs (a value
  // starting with http:// , https:// or / is used as-is and ignores assetBase).
  companyLogo:     "keybase-logo.png",
  profilePhoto:    "profile.jpg",
  backgroundPhoto: "profile-background.jpg",

  address: {
    line1: "1725 16th Avenue, Suite 101",
    line2: "Richmond Hill, ON L4B 0B3",
  },

  contact: {
    phone:    "905-709-7911 Ext. 0000",
    tollFree: "",                        // optional — leave "" to hide the row
    email:    "first.last@keybase.com",
    website:  "www.keybase.com",
  },
};
/* ========================================================================= */


/* ---- Render -------------------------------------------------------------- */
const fullName = [CARD.firstName, CARD.lastName].filter(Boolean).join(" ");
const mailto   = "mailto:" + CARD.contact.email;
const telHref  = "tel:" + CARD.contact.phone.replace(/[^+\d]/g, "");
const siteHref = "https://" + CARD.contact.website.replace(/^https?:\/\//, "");

const $ = (id) => document.getElementById(id);

document.title = fullName + " — " + CARD.title + ", " + CARD.company;

/* Absolute URLs and root-relative paths are used as-is; bare file names are
   resolved against assetBase. */
const asset = (file) =>
  /^(https?:)?\/\//.test(file) || file.startsWith("/")
    ? file
    : (CARD.assetBase || "") + file;

$("kb-logo").src      = asset(CARD.companyLogo);
$("kb-logo").alt      = CARD.company + " logo";
$("kb-banner").src    = asset(CARD.backgroundPhoto);
$("kb-portrait").src  = asset(CARD.profilePhoto);
$("kb-portrait").alt  = fullName + " portrait";

/* If an image 404s or is blocked, degrade instead of showing a broken icon. */
$("kb-initials").textContent = [CARD.firstName, CARD.lastName]
  .filter(Boolean).map((n) => n.charAt(0).toUpperCase()).join("");
$("kb-logo").addEventListener("error", () => { $("kb-logo").style.display = "none"; });
$("kb-banner").addEventListener("error", () => { $("kb-banner").classList.add("is-missing"); });
$("kb-portrait").addEventListener("error", () => { $("kb-portraitWrap").classList.add("is-missing"); });

$("kb-addr1").textContent   = CARD.address.line1;
$("kb-addr2").textContent   = CARD.address.line2;
$("kb-name").textContent    = fullName;
$("kb-title").textContent   = CARD.title;
$("kb-tagline").textContent = CARD.tagline;
if (!CARD.tagline) $("kb-tagline").style.display = "none";

$("kb-phoneLink").textContent = CARD.contact.phone;
$("kb-phoneLink").href        = telHref;

if (CARD.contact.tollFree) {
  $("kb-tollFreeRow").style.display  = "";
  $("kb-tollFreeLink").textContent   = CARD.contact.tollFree;
  $("kb-tollFreeLink").href          = "tel:" + CARD.contact.tollFree.replace(/[^+\d]/g, "");
}

$("kb-emailLink").textContent = CARD.contact.email;
$("kb-emailLink").href        = mailto;
$("kb-emailBtn").href         = mailto;
$("kb-siteLink").textContent  = CARD.contact.website;
$("kb-siteLink").href         = siteHref;

$("kb-qrName").textContent    = fullName;
$("kb-qrTitle").textContent   = CARD.title;
$("kb-qrCompany").textContent = CARD.company;


/* ---- Flip ---------------------------------------------------------------- */
const stage = $("kb-stage");
$("kb-flipBtn").addEventListener("click", () => {
  const flipped = stage.classList.toggle("is-flipped");
  $("kb-iconQr").style.display    = flipped ? "none" : "";
  $("kb-iconClose").style.display = flipped ? "" : "none";
  $("kb-flipBtn").setAttribute("aria-label", flipped ? "Show card front" : "Show QR code");
});


/* ---- QR code -------------------------------------------------------------
   Drawn as inline SVG from the encoder at the bottom of this file: white
   modules on a transparent background, with a 1-module quiet zone. */
try {
  const qr = makeQrCode(CARD.cardUrl);
  const q  = 1;                                  // quiet-zone width, in modules
  const dim = qr.size + q * 2;
  let path = "";
  for (let y = 0; y < qr.size; y++) {
    for (let x = 0; x < qr.size; x++) {
      if (qr.modules[y][x]) path += "M" + (x + q) + " " + (y + q) + "h1v1h-1z";
    }
  }
  $("kb-qrSlot").innerHTML =
    '<svg viewBox="0 0 ' + dim + " " + dim + '" shape-rendering="crispEdges" ' +
    'role="img" aria-label="QR code linking to ' + fullName +
    "'s digital business card\">" +
    '<path fill="#ffffff" d="' + path + '"/></svg>';
} catch (err) {
  $("kb-qrFallback").textContent = CARD.cardUrl;
}


/* ---- Share: native sheet on mobile, clipboard fallback elsewhere --------- */
$("kb-shareBtn").addEventListener("click", async () => {
  const shareData = {
    title: fullName + " — " + CARD.title,
    text:  fullName + ", " + CARD.title + " at " + CARD.company,
    url:   CARD.cardUrl,
  };

  if (navigator.share) {
    try { await navigator.share(shareData); return; }
    catch (err) { if (err && err.name === "AbortError") return; }
  }

  try {
    await navigator.clipboard.writeText(CARD.cardUrl);
    const label = $("kb-shareLabel");
    label.textContent = "Link copied";
    setTimeout(() => { label.textContent = "Share Card"; }, 2200);
  } catch {
    window.prompt("Copy this link:", CARD.cardUrl);
  }
});


/* ---- QR encoder -----------------------------------------------------------
   Self-contained ISO/IEC 18004 encoder: byte mode, error-correction level M,
   versions 1-40, automatic mask selection. Verified module-for-module against
   the qrcode npm library, so it produces the exact same symbol the rest of our
   cards use. No network access, no dependencies. Nothing below needs editing.
   ------------------------------------------------------------------------ */
function makeQrCode(text, forcedMask) {
  var ECC_PER_BLOCK = [-1,
    10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,
    26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28];
  var NUM_BLOCKS = [-1,
    1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,
    17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49];

  function rawDataModules(ver) {
    var result = (16 * ver + 128) * ver + 64;
    if (ver >= 2) {
      var numAlign = Math.floor(ver / 7) + 2;
      result -= (25 * numAlign - 10) * numAlign - 55;
      if (ver >= 7) result -= 36;
    }
    return result;
  }
  function dataCodewords(ver) {
    return Math.floor(rawDataModules(ver) / 8) - ECC_PER_BLOCK[ver] * NUM_BLOCKS[ver];
  }
  function mul(x, y) {
    var z = 0;
    for (var i = 7; i >= 0; i--) {
      z = (z << 1) ^ ((z >>> 7) * 0x11d);
      z ^= ((y >>> i) & 1) * x;
    }
    return z & 0xff;
  }
  function rsDivisor(degree) {
    var result = [];
    for (var i = 0; i < degree; i++) result.push(0);
    result[degree - 1] = 1;
    var root = 1;
    for (var i = 0; i < degree; i++) {
      for (var j = 0; j < degree; j++) {
        result[j] = mul(result[j], root);
        if (j + 1 < degree) result[j] ^= result[j + 1];
      }
      root = mul(root, 0x02);
    }
    return result;
  }
  function rsRemainder(data, divisor) {
    var result = divisor.map(function () { return 0; });
    for (var i = 0; i < data.length; i++) {
      var factor = data[i] ^ result.shift();
      result.push(0);
      for (var j = 0; j < divisor.length; j++) result[j] ^= mul(divisor[j], factor);
    }
    return result;
  }

  /* ---- UTF-8 bytes ---- */
  var bytes = [];
  var utf8 = unescape(encodeURIComponent(text));
  for (var i = 0; i < utf8.length; i++) bytes.push(utf8.charCodeAt(i) & 0xff);

  /* ---- Pick the smallest version that fits ---- */
  var ver = 0;
  for (var v = 1; v <= 40; v++) {
    var ccBits = v <= 9 ? 8 : 16;
    if (4 + ccBits + 8 * bytes.length <= dataCodewords(v) * 8) { ver = v; break; }
  }
  if (ver === 0) throw new Error("data too long for a QR code");
  var size = ver * 4 + 17;

  /* ---- Bit stream: mode + length + payload + padding ---- */
  var bits = [];
  function appendBits(val, len) {
    for (var i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1);
  }
  appendBits(4, 4);
  appendBits(bytes.length, ver <= 9 ? 8 : 16);
  for (var i = 0; i < bytes.length; i++) appendBits(bytes[i], 8);

  var capacityBits = dataCodewords(ver) * 8;
  appendBits(0, Math.min(4, capacityBits - bits.length));
  appendBits(0, (8 - (bits.length % 8)) % 8);
  for (var pad = 0xec; bits.length < capacityBits; pad ^= 0xec ^ 0x11) appendBits(pad, 8);

  var dataCw = [];
  for (var i = 0; i < bits.length; i += 8) {
    var b = 0;
    for (var j = 0; j < 8; j++) b = (b << 1) | bits[i + j];
    dataCw.push(b);
  }

  /* ---- Error correction + block interleaving ---- */
  var numBlocks = NUM_BLOCKS[ver];
  var eccLen = ECC_PER_BLOCK[ver];
  var rawCw = Math.floor(rawDataModules(ver) / 8);
  var numShort = numBlocks - (rawCw % numBlocks);
  var shortLen = Math.floor(rawCw / numBlocks);
  var divisor = rsDivisor(eccLen);
  var blocks = [];
  for (var i = 0, k = 0; i < numBlocks; i++) {
    var len = shortLen - eccLen + (i < numShort ? 0 : 1);
    var dat = dataCw.slice(k, k + len);
    k += len;
    var ecc = rsRemainder(dat, divisor);
    if (i < numShort) dat = dat.concat([0]);
    blocks.push(dat.concat(ecc));
  }
  var allCw = [];
  for (var i = 0; i < blocks[0].length; i++) {
    for (var j = 0; j < blocks.length; j++) {
      if (i !== shortLen - eccLen || j >= numShort) allCw.push(blocks[j][i]);
    }
  }

  /* ---- Matrix ---- */
  var modules = [], isFn = [];
  for (var y = 0; y < size; y++) {
    modules.push(new Array(size).fill(false));
    isFn.push(new Array(size).fill(false));
  }
  function setFn(x, y, dark) {
    if (x < 0 || y < 0 || x >= size || y >= size) return;
    modules[y][x] = dark;
    isFn[y][x] = true;
  }
  function getBit(x, i) { return ((x >>> i) & 1) !== 0; }

  // Timing patterns
  for (var i = 0; i < size; i++) { setFn(6, i, i % 2 === 0); setFn(i, 6, i % 2 === 0); }
  // Finder patterns + separators
  [[3, 3], [size - 4, 3], [3, size - 4]].forEach(function (p) {
    for (var dy = -4; dy <= 4; dy++) {
      for (var dx = -4; dx <= 4; dx++) {
        var dist = Math.max(Math.abs(dx), Math.abs(dy));
        setFn(p[0] + dx, p[1] + dy, dist !== 2 && dist !== 4);
      }
    }
  });
  // Alignment patterns
  var alignPos = [];
  if (ver > 1) {
    var numAlign = Math.floor(ver / 7) + 2;
    var step = ver === 32 ? 26 : Math.ceil((ver * 4 + 4) / (numAlign * 2 - 2)) * 2;
    alignPos = [6];
    for (var pos = size - 7; alignPos.length < numAlign; pos -= step) alignPos.splice(1, 0, pos);
  }
  for (var i = 0; i < alignPos.length; i++) {
    for (var j = 0; j < alignPos.length; j++) {
      var corner = (i === 0 && j === 0) || (i === 0 && j === alignPos.length - 1) ||
                   (i === alignPos.length - 1 && j === 0);
      if (corner) continue;
      for (var dy = -2; dy <= 2; dy++) {
        for (var dx = -2; dx <= 2; dx++) {
          setFn(alignPos[i] + dx, alignPos[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
        }
      }
    }
  }
  // Version information (version 7 and up)
  if (ver >= 7) {
    var rem = ver;
    for (var i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1f25);
    var vbits = (ver << 12) | rem;
    for (var i = 0; i < 18; i++) {
      var bit = getBit(vbits, i), a = size - 11 + (i % 3), b = Math.floor(i / 3);
      setFn(a, b, bit); setFn(b, a, bit);
    }
  }

  function drawFormat(mask) {
    var data = (0 << 3) | mask;             // 0 = ECC level M
    var rem = data;
    for (var i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
    var fbits = ((data << 10) | rem) ^ 0x5412;
    for (var i = 0; i <= 5; i++) setFn(8, i, getBit(fbits, i));
    setFn(8, 7, getBit(fbits, 6));
    setFn(8, 8, getBit(fbits, 7));
    setFn(7, 8, getBit(fbits, 8));
    for (var i = 9; i < 15; i++) setFn(14 - i, 8, getBit(fbits, i));
    for (var i = 0; i < 8; i++) setFn(size - 1 - i, 8, getBit(fbits, i));
    for (var i = 8; i < 15; i++) setFn(8, size - 15 + i, getBit(fbits, i));
    setFn(8, size - 8, true);
  }
  drawFormat(0);

  /* ---- Data placement (zigzag, skipping the vertical timing column) ---- */
  var idx = 0;
  for (var right = size - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
    for (var vert = 0; vert < size; vert++) {
      for (var j = 0; j < 2; j++) {
        var x = right - j;
        var upward = ((right + 1) & 2) === 0;
        var y = upward ? size - 1 - vert : vert;
        if (!isFn[y][x] && idx < allCw.length * 8) {
          modules[y][x] = getBit(allCw[idx >>> 3], 7 - (idx & 7));
          idx++;
        }
      }
    }
  }

  /* ---- Masking ---- */
  function maskFn(m, x, y) {
    switch (m) {
      case 0: return (x + y) % 2 === 0;
      case 1: return y % 2 === 0;
      case 2: return x % 3 === 0;
      case 3: return (x + y) % 3 === 0;
      case 4: return (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0;
      case 5: return ((x * y) % 2) + ((x * y) % 3) === 0;
      case 6: return (((x * y) % 2) + ((x * y) % 3)) % 2 === 0;
      case 7: return ((((x + y) % 2) + ((x * y) % 3)) % 2) === 0;
    }
  }
  function applyMask(m) {
    for (var y = 0; y < size; y++) {
      for (var x = 0; x < size; x++) {
        if (!isFn[y][x] && maskFn(m, x, y)) modules[y][x] = !modules[y][x];
      }
    }
  }
  function penalty() {
    var result = 0, x, y;
    // Rule 1 — runs of 5+ same-colour modules in a row or column.
    for (y = 0; y < size; y++) {
      var runRow = 0, runCol = 0, lastRow = null, lastCol = null;
      for (x = 0; x < size; x++) {
        var mh = modules[y][x];
        if (mh === lastRow) runRow++;
        else { if (runRow >= 5) result += 3 + (runRow - 5); lastRow = mh; runRow = 1; }
        var mv = modules[x][y];
        if (mv === lastCol) runCol++;
        else { if (runCol >= 5) result += 3 + (runCol - 5); lastCol = mv; runCol = 1; }
      }
      if (runRow >= 5) result += 3 + (runRow - 5);
      if (runCol >= 5) result += 3 + (runCol - 5);
    }
    // Rule 2 — 2x2 blocks of one colour.
    for (y = 0; y < size - 1; y++) {
      for (x = 0; x < size - 1; x++) {
        var sum = modules[y][x] + modules[y][x + 1] + modules[y + 1][x] + modules[y + 1][x + 1];
        if (sum === 4 || sum === 0) result += 3;
      }
    }
    // Rule 3 — 1:1:3:1:1 finder-like pattern next to 4 light modules.
    for (y = 0; y < size; y++) {
      var bitsRow = 0, bitsCol = 0;
      for (x = 0; x < size; x++) {
        bitsRow = ((bitsRow << 1) & 0x7ff) | (modules[y][x] ? 1 : 0);
        if (x >= 10 && (bitsRow === 0x5d0 || bitsRow === 0x05d)) result += 40;
        bitsCol = ((bitsCol << 1) & 0x7ff) | (modules[x][y] ? 1 : 0);
        if (x >= 10 && (bitsCol === 0x5d0 || bitsCol === 0x05d)) result += 40;
      }
    }
    // Rule 4 — deviation of dark-module share from 50%.
    var dark = 0;
    for (y = 0; y < size; y++) for (x = 0; x < size; x++) if (modules[y][x]) dark++;
    result += Math.abs(Math.ceil((dark * 100 / (size * size)) / 5) - 10) * 10;
    return result;
  }

  var bestMask = -1, minPenalty = Infinity;
  if (forcedMask !== undefined && forcedMask !== null) {
    bestMask = forcedMask;
  } else {
    for (var m = 0; m < 8; m++) {
      applyMask(m); drawFormat(m);
      var p = penalty();
      if (p < minPenalty) { minPenalty = p; bestMask = m; }
      applyMask(m);
    }
  }
  applyMask(bestMask);
  drawFormat(bestMask);

  return { size: size, modules: modules, version: ver, mask: bestMask };
}

})();
</script>
